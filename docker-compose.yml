services:
  family-management-api:
    image: angelrush91/family-management-api:latest
    container_name: family-management-api
    restart: unless-stopped
    ports:
      - "5270:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__ReceiptDatabase=Data Source=/app/data/receipts.db
      - GoogleDrive__LocalStorageFallbackDirectory=/app/data/receipts_storage
    volumes:
      - family_data:/app/data

volumes:
  family_data:
