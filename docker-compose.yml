services:
  family-management-api:
    image: angelrush91/family-management-api:latest
    container_name: family-management-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__ReceiptDatabase=Data Source=/app/data/receipts.db
      - ConnectionStrings__DemoDatabase=Data Source=/app/data/demo.db
      - GoogleDrive__StorageProvider=Local
      - GoogleDrive__LocalStorageDirectory=/app/receipts_storage
      - GoogleDrive__DemoLocalStorageDirectory=/app/data/demo_receipts_storage
      - Auth__OwnerEmail=${OWNER_EMAIL:-mathi@familyhub.dk}
      - Auth__DemoEmail=${DEMO_EMAIL:-demo@familyhub.dk}
      - Auth__DemoPassword=${DEMO_PASSWORD:-FamilyHubDemo2026!}
      - Auth__AllowDevelopmentOwnerFallback=false
    volumes:
      - family_data:/app/data
      - C:\Users\mathi\Documents\FamilyManagementReceipts:/app/receipts_storage

  family-management:
    image: angelrush91/family-management-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: family-management
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./logs/web:/var/log/nginx
    depends_on:
      - family-management-api

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - family-management

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.52
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_STOPPED=false
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
    command: family-management family-management-api bjjsm-web bjjsm-api

volumes:
  family_data:


