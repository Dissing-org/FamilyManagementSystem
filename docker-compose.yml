services:
  family-management:
    image: angelrush91/family-management-api:latest
    container_name: family-management
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__ReceiptDatabase=Data Source=/app/data/receipts.db
      - GoogleDrive__StorageProvider=Local
      - GoogleDrive__LocalStorageDirectory=/app/receipts_storage
    volumes:
      - family_data:/app/data
      - C:\Users\mathi\Documents\FamilyManagementReceipts:/app/receipts_storage

volumes:
  family_data:

