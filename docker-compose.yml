services:
  family-management-api:
    image: angelrush91/family-management-api:latest
    container_name: family-management-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__ReceiptDatabase=Data Source=/app/data/receipts.db
      - GoogleDrive__StorageProvider=Local
      - GoogleDrive__LocalStorageDirectory=/app/receipts_storage
    volumes:
      - family_data:/app/data
      - C:\Users\mathi\Documents\FamilyManagementReceipts:/app/receipts_storage

  family-management:
    image: angelrush91/family-management-web:latest
    container_name: family-management
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - family-management-api

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - family-management

volumes:
  family_data:


