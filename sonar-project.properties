# SonarQube Scanner Configuration for FamilyManagementSystem
sonar.projectKey=familymanagementsystem
sonar.projectName=FamilyManagementSystem
sonar.host.url=http://localhost:9000

# Encoding
sonar.sourceEncoding=UTF-8

# Code Coverage Reports (generated via coverlet.collector)
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml

# Exclude generated code, binaries, wwwroot static assets, tools, and migrations
sonar.exclusions=**/bin/**,**/obj/**,**/wwwroot/**,**/node_modules/**,**/.tools/**,**/Migrations/**,**/*.g.cs,**/*.Designer.cs
sonar.coverage.exclusions=**/tests/**,**/*Tests/**,**/*Tests.cs,**/Migrations/**,**/Program.cs,**/AppHost.cs,**/DependencyInjection.cs,**/src/FamilyManagement.UI.Shared/Services/**,**/*.razor
sonar.cpd.exclusions=**/Migrations/**,**/Program.cs,**/SqliteSchemaInitializer.cs
