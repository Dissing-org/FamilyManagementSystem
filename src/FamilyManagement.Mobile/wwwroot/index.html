<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Family Management System</title>
    <base href="/" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        hearth: {
                            DEFAULT: '#0284C7',
                            hover: '#0369A1',
                            wash: '#F0F9FF'
                        },
                        nordic: {
                            DEFAULT: '#0284C7',
                            hover: '#0369A1',
                            wash: '#F0F9FF'
                        },
                        sand: {
                            50: '#F8FAFC',
                            100: '#F1F5F9',
                            200: '#E2E8F0',
                            card: '#FFFFFF'
                        }
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="FamilyManagement.Mobile.styles.css" />
    <link rel="icon" href="data:,">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="min-h-screen flex items-center justify-center bg-slate-50">
            <div class="text-center">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-sky-600 border-t-transparent"></div>
                <p class="mt-4 text-sm font-medium text-slate-500">Loading Family Management Mobile...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet class="hidden">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>
</html>
