server {
    listen 8080;
    server_name _;

    # Allow receipt uploads up to 50MB
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME type for WebAssembly
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # Proxy API requests to backend API container
    location /api/ {
        proxy_pass http://family-management-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Swagger endpoints to backend container
    location /swagger/ {
        proxy_pass http://family-management-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing: fallback to index.html for all client-side pages
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
