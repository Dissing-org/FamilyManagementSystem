server {
    listen 8080;
    server_name _;

    # Disable absolute redirects so reverse proxies (Cloudflare Tunnel) retain external hostname & HTTPS
    absolute_redirect off;

    # Stdout and stderr logging for container inspection
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    # Allow receipt uploads up to 50MB
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME type for WebAssembly
    include /etc/nginx/mime.types;

    # Proxy API requests to backend API container
    location /api/ {
        proxy_pass http://family-management-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Swagger endpoints to backend container
    location /swagger/ {
        proxy_pass http://family-management-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ensure index.html is never cached so clients immediately receive updated WASM fingerprints
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Static fingerprinted WebAssembly & script assets
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing: fallback to index.html for all client-side pages with no-cache headers
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html =404;
    }
}
