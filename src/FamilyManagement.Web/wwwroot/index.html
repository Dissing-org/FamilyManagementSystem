<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Familie Hub</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        hearth: {
                            DEFAULT: '#0284C7',
                            hover: '#0369A1',
                            wash: '#F0F9FF'
                        },
                        nordic: {
                            DEFAULT: '#0284C7',
                            hover: '#0369A1',
                            wash: '#F0F9FF'
                        },
                        sand: {
                            50: '#F8FAFC',
                            100: '#F1F5F9',
                            200: '#E2E8F0',
                            card: '#FFFFFF'
                        }
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FamilyManagement.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen font-sans antialiased">
    <div id="app">
        <div class="min-h-screen flex items-center justify-center bg-slate-50">
            <div class="text-center">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-sky-600 border-t-transparent"></div>
                <p class="mt-4 text-sm font-medium text-slate-500">Indlæser Familie Hub...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden">
        Der opstod en uventet fejl.
        <a href="." class="reload">Genindlæs</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
