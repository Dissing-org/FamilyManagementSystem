name: Publish Android App

on:
  workflow_dispatch:
    inputs:
      build_format:
        description: 'Package format to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - apk
          - aab
  push:
    branches: [ master, main ]
    paths:
      - 'src/FamilyManagement.Mobile/**'
      - 'src/FamilyManagement.UI.Shared/**'
      - '.github/workflows/android-publish.yml'
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  build-and-publish-android:
    name: Build & Package Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Restore Mobile Dependencies
        run: dotnet restore src/FamilyManagement.Mobile/FamilyManagement.Mobile.csproj -f net10.0-android

      - name: Publish APK (Installable Package)
        if: github.event.inputs.build_format == 'apk' || github.event.inputs.build_format == 'both' || github.event_name == 'push'
        run: |
          dotnet publish src/FamilyManagement.Mobile/FamilyManagement.Mobile.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk

      - name: Publish AAB (Google Play Store Bundle)
        if: github.event.inputs.build_format == 'aab' || github.event.inputs.build_format == 'both' || github.event_name == 'push'
        run: |
          dotnet publish src/FamilyManagement.Mobile/FamilyManagement.Mobile.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=aab

      - name: Upload APK Artifact
        if: github.event.inputs.build_format == 'apk' || github.event.inputs.build_format == 'both' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: FamilyManagement-Android-APK
          path: |
            src/FamilyManagement.Mobile/bin/Release/net10.0-android/publish/*-Signed.apk
            src/FamilyManagement.Mobile/bin/Release/net10.0-android/*-Signed.apk
            src/FamilyManagement.Mobile/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB Artifact
        if: github.event.inputs.build_format == 'aab' || github.event.inputs.build_format == 'both' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: FamilyManagement-Android-AAB
          path: |
            src/FamilyManagement.Mobile/bin/Release/net10.0-android/publish/*.aab
            src/FamilyManagement.Mobile/bin/Release/net10.0-android/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/FamilyManagement.Mobile/bin/Release/net10.0-android/publish/*-Signed.apk
            src/FamilyManagement.Mobile/bin/Release/net10.0-android/*.aab
